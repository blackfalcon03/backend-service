plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.ey'
version = '0.0.1-SNAPSHOT'
description = 'backend-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // LangChain4j for AI AutoTriage
    testImplementation 'dev.langchain4j:langchain4j:0.36.2'
    testImplementation 'dev.langchain4j:langchain4j-google-ai-gemini:0.36.2'
    testImplementation 'dev.langchain4j:langchain4j-open-ai:0.36.2'
    testImplementation 'dev.langchain4j:langchain4j-ollama:0.36.2'

    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

def loadDotEnvMap() {
    def map = [:]
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def (k, v) = trimmed.split('=', 2)
                v = v.trim().replaceAll(/^["']|["']$/, '')
                map[k.trim()] = v
            }
        }
    }
    return map
}

tasks.named('test') {
    useJUnitPlatform()
    environment System.getenv()
    environment loadDotEnvMap()
}

tasks.register('triage', JavaExec) {
    group = 'verification'
    description = 'Executes the AI AutoTriage Agent to perform Root Cause Analysis on test failures.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.ey.backendservice.triage.AutoTriageAgent'
    environment System.getenv()
    environment loadDotEnvMap()
}
